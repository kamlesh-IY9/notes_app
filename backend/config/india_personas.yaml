voice_quirks:
  - id: lowercase_starts
    description: "Doesn't capitalize first letter of lines"
    weight: 20
  - id: drop_apostrophes
    description: "dont instead of don't, cant instead of can't"
    weight: 15
  - id: use_ampersand
    description: "Uses & instead of 'and'"
    weight: 12
  - id: lol_lmao
    description: "Occasionally uses lol or lmao"
    weight: 10
  - id: double_punctuation
    description: "Uses !! or ?? or ..."
    weight: 18
  - id: no_end_periods
    description: "Doesn't end lines with periods"
    weight: 25
  - id: word_merge
    description: "Occasionally merges words"
    weight: 8
  - id: sparse_emoji
    description: "Uses 1-2 emoji total in the note"
    weight: 10
  - id: abbreviations
    description: "Uses u, bc, idk, rn, ngl, tbh"
    weight: 12
  - id: hindi_code_switch
    description: "Occasionally uses a Hindi word (yaar, na, matlab, bas, arre)"
    weight: 14
  - id: question_tag_na
    description: "Adds 'na?' or 'right?' at end of lines"
    weight: 10
