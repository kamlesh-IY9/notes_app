# Persona configuration for India / Hindi note generation
# Mirrors the structure of personas.yaml

age_brackets:
  - label: "teen"
    range: [14, 19]
    weight: 15
  - label: "young_adult"
    range: [20, 29]
    weight: 30
  - label: "adult"
    range: [30, 44]
    weight: 30
  - label: "middle_aged"
    range: [45, 59]
    weight: 15
  - label: "senior"
    range: [60, 75]
    weight: 10

genders:
  - label: "female"
    weight: 50
  - label: "male"
    weight: 45
  - label: "nonbinary"
    weight: 5

