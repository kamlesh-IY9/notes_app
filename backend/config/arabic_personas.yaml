# Persona configuration for Arabic note generation
# Countries: UAE, Saudi Arabia, Kuwait, Qatar, Oman, Bahrain, Jordan, Egypt, Morocco, Lebanon
# Mirrors the structure of india_personas.yaml

age_brackets:
  - label: "teen"
    range: [15, 19]
    weight: 10
  - label: "young_adult"
    range: [20, 29]
    weight: 30
  - label: "adult"
    range: [30, 44]
    weight: 32
  - label: "middle_aged"
    range: [45, 59]
    weight: 18
  - label: "senior"
    range: [60, 75]
    weight: 10

genders:
  - label: "female"
    weight: 48
  - label: "male"
    weight: 47
  - label: "nonbinary"
    weight: 5

# Arab countries + large expat hubs
states:
  - UAE - Saudi Arabia - Kuwait - Qatar - Oman - Bahrain
  - Jordan - Egypt - Morocco - Lebanon - Tunisia - Algeria
  - Palestine - Iraq - Libya - Sudan - Yemen

excluded_states: []

