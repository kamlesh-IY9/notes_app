  - need verify
  - iirc
  - dont quote me but
  - might b wrong
  - need recheck
  - hmm
  - from the session today
  - wait no
  - actually
  - check this
  - TODO look into this more
  - hard to tell
  - not sure tho
  - need double check
  - gotta look this up
  - ok actually
  - weird tho
