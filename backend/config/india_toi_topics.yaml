# Indian-specific numbers and units for LLM to use
india_numbers:
  currency_format: "₹X lakh or ₹X crore (not million/billion)"
  number_system: "1,00,000 not 100,000"
  units:
    - km
    - kg
    - liter
    - acre
    - bigha
    - MW
    - GW
    - bps
    - rpm
    - kmph
    - crore
    - lakh

# Personal reaction phrases (same as English — person is writing in English first)
reaction_phrases:
  - is this normal??
