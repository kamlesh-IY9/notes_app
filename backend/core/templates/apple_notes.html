<!DOCTYPE html>
<html lang="{{LANG_ATTR}}" dir="{{TEXT_DIR}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
  }

  body {
    font-family: {{FONT_FAMILY}};
    overflow: hidden;
    position: relative;
  }

  body.light {
    background: #FFFFFF;
    color: #000000;
  }

  body.ios-paper {
    background: #FAFAFA;
    background-image: repeating-linear-gradient(rgba(0, 0, 0, 0.05) 0px, transparent 1px, transparent 28px, rgba(0, 0, 0, 0.05) 29px);
  }

  body.ios-warm {
    background: #FCFBF7;
  }

  body.ios-creamy {
    background: #F4F2EC;
  }

  body.ios-classic {
    background: #F2F2F7;
    background-image: radial-gradient(#E5E5EA 1px, transparent 0);
    background-size: 10px 10px;
  }

  body.dark {
    background: #1C1C1E;
    color: #FFFFFF;
  }

  /* ── Status Bar ── */
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 28px 48px 0 48px;
    height: 110px;
    font-size: 38px;
    font-weight: 600;
  }

  .status-bar .time { flex: 1; }
  .status-bar .icons {
    flex: 1;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 8px;
  }

  .carrier-name {
    font-size: 28px;
    font-weight: 500;
  }

  .battery-pct {
    font-size: 28px;
    font-weight: 500;
    margin-left: 4px;
  }

  /* Signal bars */
  .signal-bars { display: flex; gap: 3px; align-items: flex-end; height: 26px; }
  .signal-bars .bar {
    width: 6px;
    border-radius: 2px;
  }
  body.light .signal-bars .bar { background: #000; }
  body.dark .signal-bars .bar { background: #fff; }
  body.light .signal-bars .bar.empty { background: #ccc; }
  body.dark .signal-bars .bar.empty { background: #555; }

  /* WiFi icon (simplified SVG) */
  .wifi-icon { width: 36px; height: 26px; }
  body.light .wifi-icon path { fill: #000; }
  body.dark .wifi-icon path { fill: #fff; }

  /* Battery */
  .battery { display: flex; align-items: center; gap: 4px; }
  .battery-body {
    width: 56px; height: 26px;
    border: 3px solid;
    border-radius: 6px;
    position: relative;
    overflow: hidden;
  }
  body.light .battery-body { border-color: #000; }
  body.dark .battery-body { border-color: #fff; }
  .battery-fill {
    height: 100%;
    border-radius: 1px;
  }
  body.light .battery-fill { background: #000; }
  body.dark .battery-fill { background: #fff; }
  .battery-fill.low { background: #FF3B30 !important; }
  .battery-fill.charging { background: #34C759 !important; }
  .battery-tip {
    width: 4px; height: 10px;
    border-radius: 0 2px 2px 0;
  }
  body.light .battery-tip { background: #000; }
  body.dark .battery-tip { background: #fff; }

  .badge-5g, .badge-lte {
    font-size: 24px;
    font-weight: 700;
    margin-left: 4px;
  }

  .no-service {
    font-size: 24px;
    font-weight: 500;
  }

  /* ── Header (back + title + icons) ── */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 32px;
    height: 90px;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 38px;
  }

  body.light .header-left { color: #F5A623; }
  body.dark .header-left { color: #F5A623; }

  .back-chevron {
    font-size: 48px;
    font-weight: 300;
  }

  .header-right {
    display: flex;
    gap: 16px;
  }

  .header-icon {
    width: 52px;
    height: 52px;
  }

  body.light .header-icon path { stroke: #F5A623; fill: none; }
  body.dark .header-icon path { stroke: #F5A623; fill: none; }

  /* ── Date Label ── */
  .date-label {
    text-align: center;
    font-size: 28px;
    padding: 8px 0 24px 0;
  }

  body.light .date-label { color: #8E8E93; }
  body.dark .date-label { color: #8E8E93; }

  /* ── Note Content ── */
  .note-content {
    padding: 0 44px;
    padding-top: var(--body-offset, 0px);
  }

  .note-title {
    font-size: var(--title-size, 30px);
    font-weight: 700;
    margin-bottom: 6px;
    line-height: 1.3;
    letter-spacing: var(--letter-spacing, 0px);
  }

  .note-body {
    font-size: var(--body-size, 22px);
    font-weight: 400;
    line-height: 1.45;
    white-space: pre-wrap;
    letter-spacing: var(--letter-spacing, 0px);
  }

  /* No-title mode: first line is slightly bolder */
  .note-body.no-title .first-line {
    font-weight: 500;
    font-size: calc(var(--body-size, 22px) + 2px);
  }

  /* ── Bottom Toolbar ── */
  .bottom-toolbar {
    position: absolute;
    bottom: 44px;
    left: 0; right: 0;
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding: 12px 0;
    border-top: 0.5px solid;
  }

  body.light .bottom-toolbar { border-color: #C6C6C8; }
  body.dark .bottom-toolbar { border-color: #38383A; }

  .toolbar-icon { width: 52px; height: 52px; }
  body.light .toolbar-icon path { stroke: #F5A623; fill: none; }
  body.dark .toolbar-icon path { stroke: #F5A623; fill: none; }

  /* ── Home Indicator ── */
  .home-indicator {
    position: absolute;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    width: 280px;
    height: 10px;
    border-radius: 5px;
  }
  body.light .home-indicator { background: #000; }
  body.dark .home-indicator { background: #fff; }
</style>
</head>
<body class="{{THEME}}">

<!-- Status Bar -->
<div class="status-bar">
  <div class="time">{{STATUS_TIME}}</div>
  <div class="icons">
    {{SIGNAL_BARS}}
    {{WIFI_ICON}}
    {{BADGE}}
    {{BATTERY}}
  </div>
</div>

<!-- Header -->
<div class="header">
  <div class="header-left">
    <span class="back-chevron">❮</span>
    <span>{{FOLDER_LABEL}}</span>
  </div>
  <div class="header-right">
    <svg class="header-icon" viewBox="0 0 24 24"><path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8M16 6l-4-4-4 4M12 2v13" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <svg class="header-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke-width="1.5"/><circle cx="12" cy="12" r="1.5" fill="#F5A623" stroke="none"/><circle cx="7" cy="12" r="1.5" fill="#F5A623" stroke="none"/><circle cx="17" cy="12" r="1.5" fill="#F5A623" stroke="none"/></svg>
  </div>
</div>

<!-- Date Label -->
<div class="date-label">{{DATE_LABEL}}</div>

<!-- Note Content -->
<div class="note-content" style="--body-offset: {{BODY_OFFSET}}px; --letter-spacing: {{LETTER_SPACING}}px; --title-size: {{TITLE_SIZE}}px; --body-size: {{BODY_SIZE}}px;">
  {{NOTE_CONTENT}}
</div>

<!-- Bottom Toolbar -->
<div class="bottom-toolbar">
  <svg class="toolbar-icon" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h8" stroke-width="1.5" stroke-linecap="round"/></svg>
  <svg class="toolbar-icon" viewBox="0 0 24 24"><path d="M15.172 7l-6.586 6.586a2 2 0 000 2.828l.001.001a2 2 0 002.828 0L18 9.828V7h-2.828z" stroke-width="1.5"/><path d="M4 20h16" stroke-width="1.5" stroke-linecap="round"/></svg>
  <svg class="toolbar-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 15l-5-5h3V7h4v5h3l-5 5z" stroke-width="1.5"/></svg>
  <svg class="toolbar-icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" stroke-width="1.5"/><polyline points="14 2 14 8 20 8" stroke-width="1.5"/></svg>
</div>

<!-- Home Indicator -->
<div class="home-indicator"></div>

</body>
</html>
