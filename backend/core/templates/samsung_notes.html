<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
  }

  body {
    font-family: {{FONT_FAMILY}};
    overflow: hidden;
    position: relative;
  }

  body.light {
    background: #FFFFFF;
    color: #1A1A1A;
  }

  body.dark {
    background: #121212;
    color: #E0E0E0;
  }

  /* ── Status Bar ── */
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 28px 56px 0 56px;
    height: 110px;
    font-size: 38px;
    font-weight: 500;
  }

  .status-bar .time { flex: 1; }
  .status-bar .icons {
    flex: 1;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 10px;
  }

  .carrier-name {
    font-size: 28px;
    font-weight: 500;
  }

  .battery-pct {
    font-size: 28px;
    font-weight: 500;
    margin-left: 4px;
  }

  .signal-bars { display: flex; gap: 3px; align-items: flex-end; height: 28px; }
  .signal-bars .bar { width: 6px; border-radius: 2px; }
  body.light .signal-bars .bar { background: #000; }
  body.dark .signal-bars .bar { background: #fff; }
  body.light .signal-bars .bar.empty { background: #ccc; }
  body.dark .signal-bars .bar.empty { background: #444; }

  .wifi-icon { width: 36px; height: 28px; }
  body.light .wifi-icon path { fill: #000; }
  body.dark .wifi-icon path { fill: #fff; }

  .battery-body {
    width: 56px; height: 26px;
    border: 3px solid;
    border-radius: 6px;
    position: relative;
    overflow: hidden;
  }
  body.light .battery-body { border-color: #000; }
  body.dark .battery-body { border-color: #fff; }
  .battery-fill { height: 100%; border-radius: 1px; }
  body.light .battery-fill { background: #000; }
  body.dark .battery-fill { background: #fff; }
  .battery-fill.low { background: #FF0000 !important; }
  .battery-fill.charging { background: #00C853 !important; }
  .battery-tip { width: 5px; height: 12px; border-radius: 0 3px 3px 0; }
  body.light .battery-tip { background: #000; }
  body.dark .battery-tip { background: #fff; }

  .badge-5g, .badge-lte { font-size: 26px; font-weight: 700; }
  .no-service { font-size: 26px; font-weight: 500; }

  /* ── Top Bar with date ── */
  .top-bar {
    display: flex;
    align-items: center;
    padding: 16px 48px;
    height: 110px;
  }

  .back-arrow {
    font-size: 56px;
    margin-right: 32px;
  }
  body.light .back-arrow { color: #1A1A1A; }
  body.dark .back-arrow { color: #E0E0E0; }

  .date-label {
    font-size: 32px;
    flex: 1;
  }
  body.light .date-label { color: #757575; }
  body.dark .date-label { color: #9E9E9E; }

  .top-icons {
    display: flex;
    gap: 16px;
  }

  .top-icon { width: 52px; height: 52px; }
  body.light .top-icon path { stroke: #757575; fill: none; }
  body.dark .top-icon path { stroke: #9E9E9E; fill: none; }

  /* ── Note Content ── */
  .note-content {
    padding: 32px 56px;
    padding-top: var(--body-offset, 0px);
  }

  .note-title {
    font-size: var(--title-size, 28px);
    font-weight: 600;
    margin-bottom: 16px;
    line-height: 1.35;
    letter-spacing: var(--letter-spacing, 0px);
  }

  .note-body {
    font-size: var(--body-size, 22px);
    font-weight: 400;
    line-height: 1.55;
    white-space: pre-wrap;
    letter-spacing: var(--letter-spacing, 0px);
  }

  .note-body.no-title .first-line {
    font-weight: 500;
    font-size: calc(var(--body-size, 22px) + 2px);
  }

  /* ── Bottom Toolbar ── */
  .bottom-toolbar {
    position: absolute;
    bottom: 60px;
    left: 0; right: 0;
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding: 16px 0;
    border-top: 1px solid;
  }

  body.light .bottom-toolbar { border-color: #E0E0E0; }
  body.dark .bottom-toolbar { border-color: #333; }

  .toolbar-icon { width: 52px; height: 52px; }
  body.light .toolbar-icon path { stroke: #757575; fill: none; }
  body.dark .toolbar-icon path { stroke: #9E9E9E; fill: none; }

  .home-indicator {
    position: absolute;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    width: 280px;
    height: 10px;
    border-radius: 5px;
  }
  body.light .home-indicator { background: #000; }
  body.dark .home-indicator { background: #fff; }
</style>
</head>
<body class="{{THEME}}">

<div class="status-bar">
  <div class="time">{{STATUS_TIME}}</div>
  <div class="icons">
    <span class="carrier-name">{{CARRIER_NAME}}</span>
    {{SIGNAL_BARS}}
    {{WIFI_ICON}}
    {{BADGE}}
    {{BATTERY}}
  </div>
</div>

<div class="top-bar">
  <span class="back-arrow">←</span>
  <div class="date-label">{{DATE_LABEL}}</div>
  <div class="top-icons">
    <svg class="top-icon" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>
  </div>
</div>

<div class="note-content" style="--body-offset: {{BODY_OFFSET}}px; --letter-spacing: {{LETTER_SPACING}}px; --title-size: {{TITLE_SIZE}}px; --body-size: {{BODY_SIZE}}px;">
  {{NOTE_CONTENT}}
</div>

<div class="bottom-toolbar">
  <svg class="toolbar-icon" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7" stroke-width="1.5" stroke-linecap="round"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z" stroke-width="1.5"/></svg>
  <svg class="toolbar-icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke-width="2" stroke-linecap="round"/></svg>
</div>

<div class="home-indicator"></div>

</body>
</html>
