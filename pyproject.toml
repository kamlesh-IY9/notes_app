[project]
name = "notes-generator"
version = "0.1.0"
description = "Notes Generator — training data for People & Relationships notes"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "aiosqlite>=0.20.0",
    "openai>=1.40.0",
    "google-genai>=1.0.0",
    "groq>=0.9.0",
    "aiolimiter>=1.1.0",
    "playwright>=1.40.0",
    "sentence-transformers>=3.0.0",
    "numpy>=1.26.0",
    "gender-guesser>=0.4.0",
    "pyyaml>=6.0",
    "sse-starlette>=2.0.0",
    "python-multipart>=0.0.9",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
